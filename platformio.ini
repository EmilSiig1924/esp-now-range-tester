[platformio]
default_envs = receiver_s3

[env]
platform = espressif32 @ 6.10.0
framework = espidf
monitor_speed = 115200
monitor_filters = direct
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
board_build.flash_mode = dio
; Conservative 4 MB layout works on larger flash chips too. PSRAM is unused.
board_upload.flash_size = 4MB

[env:receiver_s3]
board = esp32-s3-devkitc-1
upload_port = COM7
monitor_port = COM7

[env:transmitter_c6]
board = esp32-c6-devkitc-1
build_flags = -DRANGE_TRANSMITTER
upload_port = COM3
monitor_port = COM3

; Button-triggered round-trip test. Flash both of these profiles together.
[env:button_s3]
board = esp32-s3-devkitc-1
build_flags = -DRANGE_BUTTON
upload_port = COM7
monitor_port = COM7

[env:echo_c6]
board = esp32-c6-devkitc-1
build_flags = -DRANGE_ECHO
upload_port = COM3
monitor_port = COM3

; Alternatives if your second board is a classic ESP32 or another S3.
[env:transmitter_esp32]
board = esp32dev
build_flags = -DRANGE_TRANSMITTER

[env:transmitter_s3]
board = esp32-s3-devkitc-1
build_flags = -DRANGE_TRANSMITTER
upload_port = COM7
monitor_port = COM7
